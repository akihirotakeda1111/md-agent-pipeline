[project]
name = "md-agent-orchestrator"
version = "0.1.0"
description = "Deterministic orchestrator foundation for MD-driven Codex execution"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]

[tool.setuptools.package-data]
agent = ["config.json"]

[tool.pytest.ini_options]
testpaths = ["agent/tests"]
pythonpath = ["."]

[tool.ruff]
src = ["agent"]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
